services:
    app:
        build: .
        command: uv run python -m backend.app.main
        ports:
            - "8000:8000"
        env_file:
            - .env
        volumes:
            - uploads:/app/uploads
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_started

    worker:
        build: .
        command: uv run celery -A backend.app.celery_app:celery_app worker --loglevel=INFO --pool=solo
        env_file:
            - .env
        volumes:
            - uploads:/app/uploads
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_started
    db:
        image: pgvector/pgvector:pg18
        environment:
            POSTGRES_DB: rag
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d rag" ]
            interval: 5s
            timeout: 5s
            retries: 5
    rabbitmq:
        image: rabbitmq:4.0-management
        ports:
            - "5672:5672"
            - "15672:15672"

volumes:
    postgres_data:
    uploads:
