services:
    app:
        build: ./backend
        command: uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
        ports:
            - "8000:8000"
        env_file:
            - .env
        volumes:
            - ./backend:/app/backend
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_started
            minio:
                condition: service_started

    frontend:
        build:
            context: ./frontend
        command: npm run dev -- --host 0.0.0.0
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
        depends_on:
            app:
                condition: service_started

    worker:
        build: ./backend
        command: uv run celery -A backend.app.celery_app:celery_app worker --loglevel=INFO --pool=solo
        environment:
            PYTHONPATH: /app
        env_file:
            - .env
        volumes:
            - ./backend:/app/backend
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_started
            minio:
                condition: service_started
    db:
        image: pgvector/pgvector:pg18
        environment:
            POSTGRES_DB: rag
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d rag" ]
            interval: 5s
            timeout: 5s
            retries: 5
    rabbitmq:
        image: rabbitmq:4.0-management
        ports:
            - "5672:5672"
            - "15672:15672"
    minio:
        image: minio/minio
        command: server /data --console-address ":9001"
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: minio123
        volumes:
            - minio_data:/data

    redis:
        image: redis:8-alpine
        restart: unless-stopped
volumes:
    postgres_data:
    minio_data:
    frontend_node_modules:
